[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 99
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["movici_api_client"]

[tool.poetry]
name = "movici-api-client"
version = "0.1.0"
description = "Client library and CLI tool for interfacing with the Movici Cloud Platform"
authors = ["Pelle Koster <pelle.koster@nginfra.nl>"]
license = "Movici Public License"
readme = "README.rst"
packages = [{ include = "movici_api_client", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
httpx = "^0.23.1"
click = "^8.1.3"
questionary = "^1.10.0"
tabulate = "^0.9.0"
tqdm = "^4.64.1"
gimme-that = "^0.3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.2.0"
pytest-asyncio = ">=0.20.3"
pytest-cov = ">=4.0.0"
flake8 = ">=6.0.0"
black = ">=22.12.0"
isort = ">=5.11.2"
mypy = ">=1.8.0"
pre-commit = ">=3.0.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
allow_untyped_defs = true
disable_error_code = ["override", "import-untyped"]

[tool.coverage.run]
source = ["src/movici_api_client"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]

[tool.poetry.scripts]
movici = 'movici_api_client.cli:__main__'